<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Shield & Accent Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="500" height="500" rx="40" fill="url(#bgGlow)" />

  <!-- Outer Cyber Grid Circle -->
  <circle cx="250" cy="230" r="160" fill="none" stroke="#312e81" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="250" cy="230" r="130" fill="none" stroke="#1e1b4b" stroke-width="1.5" />
  <circle cx="250" cy="230" r="100" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.4" stroke-dasharray="4 4" />

  <!-- Shield Shape Base -->
  <path d="M 250 90 L 340 130 C 340 250 250 320 250 350 C 250 320 160 250 160 130 Z" 
        fill="url(#glassGrad)" stroke="url(#shieldGrad)" stroke-width="6" filter="url(#neonGlow)" />

  <!-- Inner Radar / Scan Lines -->
  <path d="M 250 130 L 250 320 M 180 230 L 320 230" stroke="#06b6d4" stroke-width="1.5" opacity="0.3" />
  
  <!-- Central Magnifying Lens & Pulse -->
  <circle cx="235" cy="215" r="45" fill="none" stroke="#a855f7" stroke-width="5" filter="url(#neonGlow)" />
  <circle cx="235" cy="215" r="28" fill="#06b6d4" opacity="0.2" />
  <line x1="267" y1="247" x2="305" y2="285" stroke="#a855f7" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Node Dots (OSINT Network Points) -->
  <circle cx="235" cy="215" r="6" fill="#38bdf8" />
  <circle cx="290" cy="155" r="4" fill="#a855f7" />
  <circle cx="190" cy="170" r="4" fill="#38bdf8" />
  <circle cx="180" cy="260" r="4" fill="#c084fc" />
  <circle cx="300" cy="240" r="4" fill="#38bdf8" />

  <!-- Connection Lines -->
  <line x1="235" y1="215" x2="290" y2="155" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
  <line x1="235" y1="215" x2="190" y2="170" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
  <line x1="235" y1="215" x2="180" y2="260" stroke="#c084fc" stroke-width="1.5" opacity="0.7" />

  <!-- Brand Typography -->
  <text x="250" y="415" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    OSINT<tspan fill="#38bdf8">.DASH</tspan>
  </text>
  <text x="250" y="445" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="4">
    FOOTPRINT SCANNER
  </text>
</svg>
